name: evolutions

# FC 27 evolutions come out at 19:00 (Paris). Checks at 19:15 and 20:30 Paris
# time in both summer (UTC+2) and winter (UTC+1), plus one in the morning.
# Nothing is recomputed when the set of active evolutions has not changed.
on:
  schedule:
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "30 19 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (si changement), force (recalcul complet) ou probe (test d'accès FUT.GG)"
        default: auto

concurrency:
  group: evolutions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: test d'accès FUT.GG
        if: github.event.inputs.mode == 'probe'
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import evo_scan
          print(len(evo_scan.active_evolutions()), "évolutions actives lues")
          PY
          echo "[84124696, 237386]" > probe.json
          FT_SIG=probe python scripts/gen_headless.py probe.json 2
          git checkout -- data/cache/futgg_gen.json
      - name: mise à jour
        if: github.event.inputs.mode != 'probe'
        env:
          FT_WORKERS: "4"
        run: python -u scripts/evo_auto.py ${{ github.event.inputs.mode == 'force' && '--force' || '' }}
      - name: enregistrement des données
        if: github.event.inputs.mode != 'probe'
        run: |
          git config user.name "fut-tools bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Évolutions : mise à jour $(date -u +%F)" && git push)
